[pytest]
DJANGO_SETTINGS_MODULE = jazz_guitarist_paper.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    --browser chromium
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests (requires --browser)
